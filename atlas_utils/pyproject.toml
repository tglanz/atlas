[project]
name = "atlas-utils"
version = "0.1.0"
description = "Utilities for working with an Atlas deployment: exporting its data and building seed migrations."
authors = [
    { name = "Tal Glanzman", email = "talglanzman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "httpx>=0.28.1",
]

[project.scripts]
atlas-utils = "atlas_utils.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
