spring.application.name=atlas_backend

# Default datasource: SQLite file. Override with the "postgres" profile.
spring.datasource.url=jdbc:sqlite:${ATLAS_DB_PATH:./atlas.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Session cookie. Set ATLAS_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ATLAS_COOKIE_SECURE:false}

# Log levels, per logger name. DEBUG in generation shows provider requests and responses.
logging.level.com.tglanz.atlas.backend=INFO
logging.level.com.tglanz.atlas.backend.generation=DEBUG

# Image generation. Provider is "fal" or "stub". The key comes from the environment.
atlas.generation.provider=${ATLAS_GENERATION_PROVIDER:stub}
# The stub provider emulates generation: a placeholder image after a random delay.
atlas.generation.stub.image-url=https://developers.elementor.com/docs/assets/img/elementor-placeholder-image.png
atlas.generation.stub.min-delay=1s
atlas.generation.stub.max-delay=4s
atlas.generation.fal.api-key=${ATLAS_FAL_AI_API_KEY:}
atlas.generation.fal.model=openai/gpt-image-2
atlas.generation.fal.image-size=square_hd
atlas.generation.fal.quality=high
atlas.generation.fal.timeout=5m

# Root maintainer, created at startup if no user has this email. Set both through the environment.
atlas.root-user.email=${ATLAS_ROOT_USER_EMAIL:}
atlas.root-user.password=${ATLAS_ROOT_USER_PASSWORD:}
