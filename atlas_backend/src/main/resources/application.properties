spring.application.name=atlas_backend

# Hosts such as Render say which port to listen on through PORT.
server.port=${PORT:8080}
server.compression.enabled=true

# Trusted public origin for canonical URLs, social metadata, and sitemap entries.
atlas.site-url=${ATLAS_SITE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}

# Integrations. Analytics is disabled until configured; an empty coffee URL hides the link.
atlas.analytics.measurement-id=${ATLAS_GA_MEASUREMENT_ID:}
atlas.coffee-url=${ATLAS_COFFEE_URL:https://buymeacoffee.com/tglanz}

# Default datasource: SQLite file. Override with the "postgres" profile.
spring.datasource.url=jdbc:sqlite:${ATLAS_DB_SQLITE_PATH:./atlas.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Session cookie. Set ATLAS_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ATLAS_COOKIE_SECURE:false}

# Log levels, per logger name. DEBUG in generation shows provider requests and responses.
logging.level.com.tglanz.atlas.backend=INFO
logging.level.com.tglanz.atlas.backend.generation=DEBUG

# Image generation. Provider is "fal" or "stub". The key comes from the environment.
atlas.generation.provider=${ATLAS_GENERATION_PROVIDER:stub}
# The stub provider emulates generation: a placeholder image after a random delay.
atlas.generation.stub.image-url=${ATLAS_GENERATION_STUB_IMAGE_URL:https://developers.elementor.com/docs/assets/img/elementor-placeholder-image.png}
atlas.generation.stub.min-delay=${ATLAS_GENERATION_STUB_MIN_DELAY:1s}
atlas.generation.stub.max-delay=${ATLAS_GENERATION_STUB_MAX_DELAY:4s}
atlas.generation.fal.api-key=${ATLAS_FAL_AI_API_KEY:}
atlas.generation.fal.model=${ATLAS_GENERATION_FAL_MODEL:openai/gpt-image-2}
atlas.generation.fal.image-size=${ATLAS_GENERATION_FAL_IMAGE_SIZE:square_hd}
atlas.generation.fal.quality=${ATLAS_GENERATION_FAL_QUALITY:high}
atlas.generation.fal.timeout=${ATLAS_GENERATION_FAL_TIMEOUT:5m}
# A generation takes a minute or more, so the provider does not need asking often.
atlas.generation.fal.poll-interval=${ATLAS_GENERATION_FAL_POLL_INTERVAL:10s}

# Root maintainer, created at startup if no user has this email. Set both through the environment.
atlas.root-user.email=${ATLAS_ROOT_USER_EMAIL:}
atlas.root-user.password=${ATLAS_ROOT_USER_PASSWORD:}

# API reference generated from the controllers. Maintainers only; see SecurityConfig.
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
