spring.application.name=atlas_backend

# Default datasource: SQLite file. Override with the "postgres" profile.
spring.datasource.url=jdbc:sqlite:${ATLAS_DB_PATH:./atlas.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Session cookie. Set ATLAS_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ATLAS_COOKIE_SECURE:false}

# Pictures: all will be stored in S3. Until then, storage and generation are stubs that return this url.
atlas.storage.stub-url=https://developers.elementor.com/docs/assets/img/elementor-placeholder-image.png
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
