# Activate with SPRING_PROFILES_ACTIVE=postgres
# ATLAS_DB_POSTGRES_SSLMODE is optional and defaults to require, which hosted databases need.
spring.datasource.url=jdbc:postgresql://${ATLAS_DB_POSTGRES_HOST}:${ATLAS_DB_POSTGRES_PORT:5432}/${ATLAS_DB_POSTGRES_DATABASE}?sslmode=${ATLAS_DB_POSTGRES_SSLMODE:require}
spring.datasource.username=${ATLAS_DB_POSTGRES_USER}
spring.datasource.password=${ATLAS_DB_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
