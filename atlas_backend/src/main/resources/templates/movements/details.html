<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::main})}">
<body>
<main class="stack">
  <div class="cluster between">
    <h1 th:text="${movement.content().name()}">Movement</h1>
    <a th:if="${maintainer}" class="button secondary" th:href="@{/movements/{key}/edit(key=${movement.key()})}">Edit</a>
  </div>
  <div class="cluster illustrations" th:if="${!movement.illustrations().isEmpty()}">
    <img th:each="image, status : ${movement.illustrations()}" th:src="${image.imageUrl()}" th:alt="|${movement.content().name()}, step ${status.count}|" th:attr="loading=${status.first ? 'eager' : 'lazy'},fetchpriority=${status.first ? 'high' : 'auto'}" height="224" decoding="async">
  </div>
  <p class="prose" th:if="${!movement.content().description().isEmpty()}" th:text="${movement.content().description()}">Description</p>
  <section class="stack" th:each="group : ${itemGroups}" th:if="${!group.items.isEmpty()}">
    <h2 th:text="${group.title}">Cues</h2>
    <ol th:if="${group.ordered}"><li th:each="item : ${group.items}" th:text="${item.content}">Cue</li></ol>
    <ul th:unless="${group.ordered}"><li th:each="item : ${group.items}" th:text="${item.content}">Comment</li></ul>
  </section>
  <section class="stack" th:if="${!movement.content().stages().isEmpty()}">
    <h2>Stages</h2>
    <ol><li th:each="stage : ${movement.content().stages()}"><strong th:text="${stage.name}">Stage</strong><span th:text="|: ${stage.description}|">Description</span></li></ol>
  </section>
  <div class="cluster tags" th:if="${!movement.content().tags().isEmpty()}">
    <a class="tag" th:each="tag : ${movement.content().tags()}" th:href="@{/movements(tags=${tag})}" th:text="${#strings.replace(tag, '_', ' ')}">Tag</a>
  </div>
  <section class="stack" th:each="group : ${relatedGroups}">
    <h2 th:text="${group.title}">Related movements</h2>
    <div class="grid movement-grid"><th:block th:each="related : ${group.movements}"><article th:replace="~{movements/cards :: card(${related})}"></article></th:block></div>
  </section>
</main>
</body>
</html>
