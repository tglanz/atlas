plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.tglanz.atlas'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.xerial:sqlite-jdbc:3.53.4.0'
	runtimeOnly 'org.hibernate.orm:hibernate-community-dialects'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:all' << '-Werror'
}

spotless {
	java {
		googleJavaFormat()
	}
}

// The UI is built by atlas_ui and served from the same origin as the API.
// Pass -PskipUi to build the backend without Node.
def uiDir = file('../atlas_ui')

tasks.register('installUi', Exec) {
	onlyIf { !project.hasProperty('skipUi') }
	workingDir uiDir
	commandLine 'pnpm', 'install', '--frozen-lockfile'
	inputs.files(file("$uiDir/package.json"), file("$uiDir/pnpm-lock.yaml"))
	outputs.dir(file("$uiDir/node_modules"))
}

tasks.register('buildUi', Exec) {
	onlyIf { !project.hasProperty('skipUi') }
	dependsOn 'installUi'
	workingDir uiDir
	commandLine 'pnpm', 'build'
	inputs.dir(file("$uiDir/src"))
	inputs.files(fileTree(uiDir) {
		include 'index.html', 'package.json', 'vite.config.ts', 'tsconfig*.json'
	})
	outputs.dir(file("$uiDir/dist"))
}
// The plain jar is not runnable and not needed; the boot jar has a fixed name.
tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'atlas_backend.jar'
	dependsOn 'buildUi'
	from(file("$uiDir/dist")) {
		into 'BOOT-INF/classes/static'
	}
}
